function badge(b) {
  if (!b) return '';
  return `<span class="badge ${b}">${b}</span>`;
}

function renderTree(nodes, depth) {
  let html = '';
  for (const node of nodes) {
    const isDir = node.type === 'dir';
    const pad = depth * 18;
    const hasChildren = isDir && node.children && node.children.length > 0;
    const id = 'n' + Math.random().toString(36).slice(2);

    if (hasChildren) {
      html += `<div class="collapsible" id="${id}">
        <div class="node" onclick="toggle('${id}')" style="padding-left:${pad}px">
          <span class="toggle-icon">▾</span>
          <span class="icon">${isDir ? '📂' : '📄'}</span>
          <span class="label dir">${node.name}</span>
          ${badge(node.badge)}
          ${node.comment ? `<span class="comment">// ${node.comment}</span>` : ''}
        </div>
        <div class="children" style="max-height:9999px">
          ${renderTree(node.children, depth + 1)}
        </div>
      </div>`;
    } else {
      html += `<div class="node" style="padding-left:${pad}px">
        <span style="width:12px;display:inline-block"></span>
        <span class="icon">${isDir ? '📁' : '📄'}</span>
        <span class="label ${isDir ? 'dir' : ''}">${node.name}</span>
        ${badge(node.badge)}
        ${node.comment ? `<span class="comment">// ${node.comment}</span>` : ''}
      </div>`;
    }
  }
  return html;
}

function toggle(id) {
  const el = document.getElementById(id);
  const ch = el.querySelector('.children');
  const icon = el.querySelector('.toggle-icon');
  if (el.classList.contains('closed')) {
    el.classList.remove('closed');
    ch.style.maxHeight = '9999px';
  } else {
    el.classList.add('closed');
    ch.style.maxHeight = '0';
  }
}

document.getElementById('tree').innerHTML = renderTree(tree, 0);
